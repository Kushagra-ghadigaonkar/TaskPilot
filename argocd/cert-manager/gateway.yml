apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taskpilot-gateway
  namespace: taskpilot
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: taskpilot.local
      tls:
        mode: Terminate
        certificateRefs:
          - name: taskpilot-tls
      allowedRoutes:
        namespaces:
          from: Same