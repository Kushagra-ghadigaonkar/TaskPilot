apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from my app"
          ports:
            - containerPort: 5678