apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskpilot-route
  namespace: taskpilot
spec:
  parentRefs:
    - name: taskpilot-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-service
          port: 8081