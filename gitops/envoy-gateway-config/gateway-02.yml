apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taskpilot-gateway
  namespace: taskpilot
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  gatewayClassName: envoy
  listeners:
    # Port 80 carries the ACME challenge and the redirect. No hostname, so the
    # raw load balancer URL keeps working.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same


  # This Code Requires domain

