apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskpilot-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/Kushagra-ghadigaonkar/TaskPilot
    targetRevision: main
    path: gitops/envoy-gateway-config

  destination:
    server: https://kubernetes.default.svc
    namespace: taskpilot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true