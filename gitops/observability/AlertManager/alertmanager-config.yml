
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-alerts
  namespace: observability

spec:
  route:
    receiver: slack
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: slack
      slackConfigs:
        - channel: "#taskpilot-alerts"
          sendResolved: true
          apiURL:
            name: alertmanager-slack
            key: slack_api_url