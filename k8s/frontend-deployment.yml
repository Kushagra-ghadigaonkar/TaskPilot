kind: Deployment
apiVersion: apps/v1
metadata:
  name: dev-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels: 
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend-container
        image: kushagr488/dev-frontend:latest
        ports:
        - containerPort: 5000
