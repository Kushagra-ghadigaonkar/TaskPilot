name: Sonar Qube Scan
on:
  workflow_call:

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
        - name: Code Checkout
          uses: actions/checkout@v7

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v8.2.1
          with:
            projectBaseDir: .
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}