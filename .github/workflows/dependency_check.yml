name: Dependency Check 
on:
  workflow_call:
    
jobs:
  dependency_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7

    - name: Setup go
      uses: actions/setup-go@v6
      with:
        go-version: 1.24
        cache: true
        go-version-file: go.mod
    
    - name: Installing go vulnerability checker
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

    - name: Run govulncheck
      continue-on-error: true
      run: govulncheck ./... > vulnerability-report.txt
      working-directory: ./backend

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high > vulnerability-report.txt
      working-directory: frontend

    - name: Upload Report Artifact
      if: always() # Ensures report uploads even if tests fail
      uses: actions/upload-artifact@v7 
      with:
        name: dependency-scan-report
        path: reports/vulnerability-report.txt
        retention-days: 30
      
